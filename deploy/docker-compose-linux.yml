networks:
  ai_network:
    driver: bridge

services:
  duix-avatar-tts:
    image: guiji2025/fish-speech-ziming
    container_name: duix-avatar-tts
    restart: always
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    ports:
      - '18180:8080'
    volumes:
      - ${DUIX_HOST_TTS_DIR:-../duix_avatar_data/voice/data}:/code/data
    command: /bin/bash -c "/opt/conda/envs/python310/bin/python3 tools/api_server.py --listen 0.0.0.0:8080"
    networks:
      - ai_network
  duix-avatar-asr:
    image: guiji2025/fun-asr
    container_name: duix-avatar-asr
    restart: always
    runtime: nvidia
    privileged: true
    working_dir: /workspace/FunASR/runtime
    ports:
      - '10095:10095'
    command: sh /run.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai_network
  duix-avatar-gen-video:
    image: guiji2025/duix.avatar
    container_name: duix-avatar-gen-video
    restart: always
    runtime: nvidia
    privileged: true
    volumes:
      - ${DUIX_HOST_FACE_DIR:-../duix_avatar_data/face2face}:/code/data
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    shm_size: '8g'
    ports:
      - '8383:8383'
    command: python /code/app_local.py
    networks:
      - ai_network
  duix-avatar-web:
    build:
      context: ..
      dockerfile: src-web/Dockerfile
    container_name: duix-avatar-web
    restart: unless-stopped
    environment:
      - DUIX_FACE_DATA_DIR=/data/face2face
      - DUIX_TTS_DATA_DIR=/data/voice/data
      - DUIX_WEB_DB_PATH=/data/web/duix-web.sqlite
      - TTS_API_URL=http://duix-avatar-tts:8080
      - F2F_API_URL=http://duix-avatar-gen-video:8383/easy
      - PORT=3000
    ports:
      - '${DUIX_WEB_PORT:-3000}:3000'
    volumes:
      - ${DUIX_HOST_FACE_DIR:-../duix_avatar_data/face2face}:/data/face2face
      - ${DUIX_HOST_TTS_DIR:-../duix_avatar_data/voice/data}:/data/voice/data
      - ${DUIX_HOST_WEB_DIR:-../duix_avatar_data/web}:/data/web
    depends_on:
      - duix-avatar-tts
      - duix-avatar-gen-video
    networks:
      - ai_network
